// ── Firebase helpers ──
function fbSet(path,val){return db.ref(path).set(val)}
function fbGet(path){return db.ref(path).once("value").then(s=>s.val())}
function fbOn(path,cb){db.ref(path).on("value",s=>cb(s.val()));return()=>db.ref(path).off()}
function fbDel(path){return db.ref(path).remove()}

// Quizzes live in Firebase (`quizzes/{id}`) so they can be created/edited from the
// admin page without redeploying, and a host can pick which one to run. The first
// time the app runs against an empty database, this seeds a single quiz from
// DEFAULT_Q (or migrates the old flat `questions/` node, if one exists from before
// multi-quiz support) — after that, Firebase is the source of truth.
function useQuizzes(){
  const [quizzes,setQuizzes]=useState(null); // null=loading, else {id:{id,name,questions:[...]}}
  const migrating=useRef(false);
  useEffect(()=>fbOn("quizzes",qz=>{
    const ids=qz?Object.keys(qz):[];
    if(ids.length>0){
      const norm={};
      ids.forEach(id=>{
        const quiz=qz[id]||{};
        const qraw=quiz.questions;
        const qkeys=qraw?Object.keys(qraw):[];
        const qArr=qkeys.length>0?(Array.isArray(qraw)?qraw:qkeys.sort((a,b)=>+a-+b).map(k=>qraw[k])):[];
        norm[id]={id,name:quiz.name||"Untitled Quiz",questions:qArr};
      });
      setQuizzes(norm);
    } else if(!migrating.current){
      migrating.current=true;
      fbGet("questions").then(legacy=>{
        const lkeys=legacy?Object.keys(legacy):[];
        const qArr=lkeys.length>0?(Array.isArray(legacy)?legacy:lkeys.sort((a,b)=>+a-+b).map(k=>legacy[k])):DEFAULT_Q;
        fbSet("quizzes/default",{name:"AI Quiz 2026",questions:Object.fromEntries(qArr.map((q,i)=>[i,q]))});
      });
    }
  }),[]);
  return quizzes;
}

// admin page from being stumbled into, not a real access control (the Firebase DB
// itself has no auth and is readable by anyone with the project config).
const ADMIN_PASSCODE="ai-quiz-admin-2026";

const XLSX_HEADERS=["Question","Option A","Option B","Option C","Option D","Correct (A-D)","Timer (sec)","Category","Short Explanation","Long Explanation","Source","Source Date","Source Icon"];

function blankQuestion(){return {q:"",o:["","","",""],c:0,t:TSEC,cat:"",ex:"",xt:"",s:"",sd:"",st:"bcg"}}

function questionToRow(q){
  return {
    "Question":q.q||"",
    "Option A":q.o?.[0]||"",
    "Option B":q.o?.[1]||"",
    "Option C":q.o?.[2]||"",
    "Option D":q.o?.[3]||"",
    "Correct (A-D)":["A","B","C","D"][q.c]||"A",
    "Timer (sec)":q.t||TSEC,
    "Category":q.cat||"",
    "Short Explanation":q.ex||"",
    "Long Explanation":q.xt||"",
    "Source":q.s||"",
    "Source Date":q.sd||"",
    "Source Icon":q.st||"bcg",
  };
}

function rowToQuestion(row){
  const norm={};
  Object.keys(row).forEach(k=>{norm[k.trim().toLowerCase().replace(/[^a-z]/g,"")]=row[k]});
  const get=k=>norm[k]!==undefined?String(norm[k]).trim():"";
  const correctRaw=(get("correctad")||get("correct")||"A").toUpperCase();
  const letterIdx="ABCD".indexOf(correctRaw[0]);
  const numIdx=Number(correctRaw);
  const c=letterIdx>=0?letterIdx:(numIdx>=1&&numIdx<=4?numIdx-1:0);
  return {
    q:get("question"),
    o:[get("optiona"),get("optionb"),get("optionc"),get("optiond")],
    c,
    t:Number(get("timersec")||get("timer"))||TSEC,
    cat:get("category"),
    ex:get("shortexplanation"),
    xt:get("longexplanation"),
    s:get("source"),
    sd:get("sourcedate"),
    st:get("sourceicon")||"bcg",
  };
}

function validateQuestion(q){
  if(!q.q||!q.q.trim())return "question text is required";
  if(!Array.isArray(q.o)||q.o.length!==4||q.o.some(o=>!o||!String(o).trim()))return "all 4 options are required";
  if(!(q.c>=0&&q.c<=3))return "correct answer must be A, B, C or D";
  return null;
}

    setSaveMsg("Saving…");
    const clean=draft.map(q=>({q:q.q.trim(),o:q.o.map(o=>String(o).trim()),c:Number(q.c),t:Number(q.t)||TSEC,cat:(q.cat||"").trim()||"General",ex:(q.ex||"").trim(),xt:(q.xt||"").trim(),s:(q.s||"").trim(),sd:(q.sd||"").trim(),st:(q.st||"").trim()||"bcg"}));
    await fbSet(`quizzes/${selectedQuizId}/questions`,Object.fromEntries(clean.map((q,i)=>[i,q])));
    setDirty(false);setSaveMsg(`Saved ${clean.length} question${clean.length!==1?"s":""}.`);
  };

  const createQuiz=async()=>{
    const name=window.prompt("Name for the new quiz:");
    if(!name||!name.trim())return;
    const id="q"+Date.now();
    await fbSet(`quizzes/${id}`,{name:name.trim(),questions:{}});
    setSelectedQuizId(id);
  };
  const renameQuiz=async()=>{
    if(!selectedQuizId)return;
    const current=quizzes[selectedQuizId]?.name||"";
    const name=window.prompt("Rename quiz:",current);
    if(!name||!name.trim()||name.trim()===current)return;
    await fbSet(`quizzes/${selectedQuizId}/name`,name.trim());
  };
  const deleteQuiz=async()=>{
    if(!selectedQuizId)return;
    const qz=quizzes[selectedQuizId];
    if(!window.confirm(`Delete the quiz "${qz?.name}" and all ${qz?.questions.length||0} of its questions? This cannot be undone.`))return;
    await fbDel(`quizzes/${selectedQuizId}`);
    setSelectedQuizId(null);setDraftQuizId(null);setDraft(null);
  };

  const downloadTemplate=()=>{
    const rows=(draft&&draft.length?draft:[blankQuestion()]).map(questionToRow);
    const ws=XLSX.utils.json_to_sheet(rows,{header:XLSX_HEADERS});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Questions");
    XLSX.writeFile(wb,"quiz-questions.xlsx");
  };

  const uploadExcel=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
        const parsed=rows.map(rowToQuestion).filter(q=>q.q);
        if(parsed.length===0){setSaveMsg("No valid rows found in that file.");return}
        for(let i=0;i<parsed.length;i++){
          const rowErr=validateQuestion(parsed[i]);
          if(rowErr){setSaveMsg(`Row ${i+1} of the file: ${rowErr}`);return}
        }
        if(window.confirm(`Load ${parsed.length} question${parsed.length!==1?"s":""} from this file? This replaces the ${draft.length} question${draft.length!==1?"s":""} currently shown here — nothing is saved to the live quiz until you click "Save All Changes".`)){
          setDraft(parsed);setEditIdx(null);setDirty(true);setSaveMsg(`Loaded ${parsed.length} question${parsed.length!==1?"s":""} from file — review below, then Save All Changes.`);
        }
      }catch(readErr){setSaveMsg("Could not read that file — make sure it's an .xlsx exported from the template.")}
    };
    reader.readAsArrayBuffer(file);
    e.target.value="";
  };

  return <Wrap w={900}>
    <div style={{textAlign:"center",marginBottom:24}}>
      <Logo size={28}/>
      <h2 style={{fontSize:26,fontWeight:400,fontFamily:"Georgia,serif",marginTop:16,color:TK.navy}}>Admin</h2>
    </div>
    <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:28}}>
      <button onClick={()=>setTab("results")} style={{padding:"8px 18px",borderRadius:999,border:"none",fontSize:13,fontWeight:700,cursor:"pointer",background:tab==="results"?TK.orange:"rgba(27,20,100,.06)",color:tab==="results"?"#fff":TK.navy}}>Past Games</button>
      <button onClick={()=>setTab("questions")} style={{padding:"8px 18px",borderRadius:999,border:"none",fontSize:13,fontWeight:700,cursor:"pointer",background:tab==="questions"?TK.orange:"rgba(27,20,100,.06)",color:tab==="questions"?"#fff":TK.navy}}>Edit Questions</button>
    </div>

    {tab==="results"&&<div>
      <p style={{textAlign:"center",color:TK.grey,fontSize:14,marginTop:-16,marginBottom:20}}>{list.length} game{list.length!==1?"s":""} recorded</p>
      {results===null&&<p style={{textAlign:"center",color:TK.grey,fontStyle:"italic"}}>Loading…</p>}
      {results!==null&&list.length===0&&<p style={{textAlign:"center",color:TK.grey,fontStyle:"italic"}}>No games recorded yet.</p>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {list.map(r=>{
          const rplayers=Object.entries(r.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0));
          const winner=rplayers[0];
          const isOpen=openId===r.id;
          return <div key={r.id} style={{borderRadius:14,border:"1px solid rgba(27,20,100,.08)",overflow:"hidden"}}>
            <div onClick={()=>setOpenId(isOpen?null:r.id)} style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:16,cursor:"pointer",background:isOpen?"rgba(255,102,51,.06)":"#fff"}}>
              <div style={{flex:1}}>
                <div style={{fontSize:15,fontWeight:600,color:TK.navy}}>{new Date(r.endedAt).toLocaleString()}</div>
                <div style={{fontSize:13,color:TK.grey,marginTop:2}}>{r.quizName?`${r.quizName} · `:""}Code {r.code} · {rplayers.length} player{rplayers.length!==1?"s":""} · {r.numQuestions} questions</div>
              </div>
              {winner&&<div style={{textAlign:"right"}}>
                <div style={{fontSize:13,fontWeight:700,color:TK.orange}}>🏆 {winner.name}</div>
                <div style={{fontSize:12,color:TK.grey}}>{winner.score} pts</div>
              </div>}
              <button onClick={(e)=>{e.stopPropagation();if(window.confirm("Delete this result?"))deleteResult(r.id)}} style={{background:"none",border:"none",color:TK.grey,fontSize:18,padding:"0 4px",cursor:"pointer"}} title="Delete">✕</button>
            </div>
            {isOpen&&<div style={{padding:"0 20px 20px"}}><LBoard players={r.players} showD={false}/></div>}
          </div>;
        })}
      </div>
    </div>}

    {tab==="questions"&&<div>
      <div style={{display:"flex",flexWrap:"wrap",gap:10,justifyContent:"center",alignItems:"center",marginBottom:24,padding:"14px 16px",borderRadius:12,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)"}}>
        <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".05em"}}>Quiz</label>
        <select value={selectedQuizId||""} onChange={e=>setSelectedQuizId(e.target.value)} style={{fontSize:14,fontWeight:600,color:TK.navy,padding:"7px 12px",borderRadius:8,border:"1px solid rgba(27,20,100,.15)",background:"#fff",outline:"none"}}>
          {Object.values(quizzes||{}).map(qz=><option key={qz.id} value={qz.id}>{qz.name} ({qz.questions.length})</option>)}
        </select>
        <button onClick={renameQuiz} disabled={!selectedQuizId} style={{background:"none",border:"none",color:TK.orange,fontSize:13,fontWeight:700,cursor:selectedQuizId?"pointer":"default",opacity:selectedQuizId?1:.4}}>Rename</button>
        <button onClick={deleteQuiz} disabled={!selectedQuizId} style={{background:"none",border:"none",color:TK.bad,fontSize:13,fontWeight:700,cursor:selectedQuizId?"pointer":"default",opacity:selectedQuizId?1:.4}}>Delete</button>
        <button onClick={createQuiz} style={{background:"none",border:"none",color:TK.navy,fontSize:13,fontWeight:700,cursor:"pointer"}}>+ New Quiz</button>
      </div>
      {!selectedQuizId?<p style={{textAlign:"center",color:TK.grey,fontStyle:"italic"}}>{quizzes?"No quizzes yet — create one above.":"Loading…"}</p>:
      draft===null||draftQuizId!==selectedQuizId?<p style={{textAlign:"center",color:TK.grey,fontStyle:"italic"}}>Loading…</p>:<>
        <div style={{display:"flex",flexWrap:"wrap",gap:10,justifyContent:"center",marginBottom:8}}>
          <Btn outline onClick={addQuestion}>+ Add Question</Btn>
          <Btn outline onClick={downloadTemplate}>⬇ Download Template</Btn>
          <Btn outline onClick={()=>fileRef.current.click()}>⬆ Upload Excel</Btn>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={uploadExcel} style={{display:"none"}}/>
          <Btn onClick={saveAll} disabled={!dirty}>Save All Changes</Btn>
        </div>
        {saveMsg&&<p style={{textAlign:"center",fontSize:13,color:saveMsg.startsWith("Saved")||saveMsg.startsWith("Loaded")?TK.ok:TK.bad,marginBottom:12}}>{saveMsg}</p>}
        <p style={{textAlign:"center",fontSize:13,color:TK.grey,marginBottom:20}}>{draft.length} question{draft.length!==1?"s":""}{dirty?" · unsaved changes":""}</p>

        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {draft.map((q,idx)=>{
            const isEdit=editIdx===idx;
            return <div key={idx} style={{borderRadius:12,border:"1px solid rgba(27,20,100,.08)",overflow:"hidden"}}>
              <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12,background:isEdit?"rgba(255,102,51,.06)":"#fff"}}>
                <span style={{fontSize:12,color:TK.grey,width:22,flexShrink:0}}>{idx+1}</span>
                <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:6,background:"rgba(27,20,100,.06)",color:TK.navy,flexShrink:0,whiteSpace:"nowrap"}}>{q.cat||"—"}</span>
                <span style={{flex:1,fontSize:14,color:TK.navy,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}}>{q.q||<i style={{color:TK.grey}}>Untitled question</i>}</span>
                <span style={{fontSize:12,color:TK.ok,fontWeight:600,flexShrink:0,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{"ABCD"[q.c]}: {q.o[q.c]}</span>
                <span style={{fontSize:12,color:TK.grey,flexShrink:0}}>{q.t||TSEC}s</span>
                <button onClick={()=>setEditIdx(isEdit?null:idx)} style={{background:"none",border:"none",color:TK.orange,fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0}}>{isEdit?"Close":"Edit"}</button>
                <button onClick={()=>deleteQuestion(idx)} style={{background:"none",border:"none",color:TK.grey,fontSize:16,cursor:"pointer",flexShrink:0}} title="Delete">✕</button>
              </div>
              {isEdit&&<div style={{padding:"16px 20px",borderTop:"1px solid rgba(27,20,100,.06)",display:"flex",flexDirection:"column",gap:12}}>
                <div>
                  <label style={fieldLabel}>Question</label>
                  <textarea value={q.q} onChange={e=>updateQ(idx,"q",e.target.value)} rows={2} style={fieldInput}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {[0,1,2,3].map(oi=>
                    <div key={oi} style={{display:"flex",alignItems:"center",gap:8}}>
                      <input type="radio" name={`correct-${idx}`} checked={q.c===oi} onChange={()=>updateQ(idx,"c",oi)} title="Correct answer"/>
                      <span style={{fontSize:12,fontWeight:700,color:TK.grey,width:14,flexShrink:0}}>{"ABCD"[oi]}</span>
                      <input value={q.o[oi]} onChange={e=>updateOpt(idx,oi,e.target.value)} placeholder={`Option ${"ABCD"[oi]}`} style={{...fieldInput,flex:1}}/>
                    </div>
                  )}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 120px",gap:10}}>
                  <div><label style={fieldLabel}>Category</label><input value={q.cat} onChange={e=>updateQ(idx,"cat",e.target.value)} style={fieldInput}/></div>
                  <div><label style={fieldLabel}>Timer (sec)</label><input type="number" min="5" value={q.t} onChange={e=>updateQ(idx,"t",e.target.value)} style={fieldInput}/></div>
                </div>
                <div><label style={fieldLabel}>Short explanation</label><input value={q.ex} onChange={e=>updateQ(idx,"ex",e.target.value)} style={fieldInput}/></div>
                <div><label style={fieldLabel}>Long explanation</label><textarea value={q.xt} onChange={e=>updateQ(idx,"xt",e.target.value)} rows={3} style={fieldInput}/></div>
                <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10}}>
                  <div><label style={fieldLabel}>Source</label><input value={q.s} onChange={e=>updateQ(idx,"s",e.target.value)} style={fieldInput}/></div>
                  <div><label style={fieldLabel}>Source date</label><input value={q.sd} onChange={e=>updateQ(idx,"sd",e.target.value)} style={fieldInput}/></div>
                  <div><label style={fieldLabel}>Source icon key</label><input value={q.st} onChange={e=>updateQ(idx,"st",e.target.value)} placeholder="bcg, bain, internal, ft, ev, speech, policy" style={fieldInput}/></div>
                </div>
              </div>}
            </div>;
          })}
        </div>
      </>}
    </div>}
  </Wrap>;
}

function App(){
  const quizzes=useQuizzes();

  // URL routing: ?host → host landing, ?review → review mode, ?admin → past results, default → player landing
  const params=new URLSearchParams(window.location.search);
  const urlMode=params.has("review")?"review":params.has("admin")?"admin":params.has("host")?"host":"player";

  if(urlMode==="review")return <ReviewMode/>;
  if(urlMode==="admin")return <AdminMode/>;

  if(DISABLED)return <BrandBg><div style={{maxWidth:400,margin:"0 auto",textAlign:"center"}}><Logo size={40}/><h1 style={{fontSize:36,fontWeight:800,fontFamily:"Georgia,serif",marginTop:48,color:TK.orange,textTransform:"uppercase"}}>Coming Soon</h1><p style={{fontSize:15,color:"rgba(27,20,100,.45)",marginTop:14}}>The quiz will be activated during the seminar.</p><div style={{width:48,height:2,borderRadius:1,background:TK.orange,marginTop:32,opacity:.4,margin:"32px auto 0"}}/></div></BrandBg>;

  const [role,setRole]=useState(null);
  const [code,setCode]=useState("");
  const [pid]=useState(genId);
  const [name,setName]=useState("");
  const [avIdx,setAvIdx]=useState(0);
  const [phase,setPhase]=useState("choose");
  const [gState,setGState]=useState(null);
  const [players,setPlayers]=useState({});
  const [answers,setAnswers]=useState({});
  const [myPick,setMyPick]=useState(null);
  const [sent,setSent]=useState(false);
  const [tl,setTl]=useState(TSEC);
  const [joinCode,setJoinCode]=useState("");
  const [err,setErr]=useState("");
  const [qi,setQi]=useState(0);
  const [closingStep,setClosingStep]=useState(0);
  const [selectedQuizId,setSelectedQuizId]=useState(null);
  const tRef=useRef(null);
  const unsubs=useRef([]);
  const qStart=useRef(0);
  const prevP=useRef(null);

  const stopT=()=>{if(tRef.current){clearInterval(tRef.current);tRef.current=null}};
  const cleanup=()=>{stopT();unsubs.current.forEach(u=>u());unsubs.current=[]};
  useEffect(()=>()=>cleanup(),[]);

  // Default the host's quiz picker to the first available quiz once the catalog loads.
  useEffect(()=>{
    if(quizzes&&!selectedQuizId){
      const ids=Object.keys(quizzes);
      if(ids.length>0)setSelectedQuizId(ids[0]);
    }
  },[quizzes,selectedQuizId]);

  const nPlayers=Object.keys(players).length;
  const nAnswers=Object.keys(answers).length;
  const dist=[0,0,0,0];Object.values(answers).forEach(a=>{if(a.pick>=0&&a.pick<4)dist[a.pick]++});

  // Host
  const hostCreate=async()=>{
    if(!selectedQuizId)return;
    const c=genCode();
    await fbSet(`quiz/${c}/state`,{phase:"lobby",currentQ:0,startTime:0,quizId:selectedQuizId});
    await fbSet(`quiz/${c}/players`,{});
    setCode(c);setRole("host");setPhase("lobby");
    unsubs.current.push(fbOn(`quiz/${c}/players`,p=>setPlayers(p||{})));
  };
  const hostStartQ=async(q)=>{
    const now=Date.now();qStart.current=now;
    setQi(q);setAnswers({});setPhase("question");setTl(qTime(Q[q]));
    await fbSet(`quiz/${code}/state`,{phase:"question",currentQ:q,startTime:now});
    await fbSet(`quiz/${code}/ans_${q}`,{});
    stopT();tRef.current=setInterval(()=>setTl(t=>{if(t<=1){clearInterval(tRef.current);return 0}return t-1}),1000);
    // listen answers
    const unsub=fbOn(`quiz/${code}/ans_${q}`,a=>setAnswers(a||{}));
    unsubs.current.push(unsub);
  };
  const hostReveal=async()=>{
    stopT();
    const a=await fbGet(`quiz/${code}/ans_${qi}`)||{};setAnswers(a);
    const p=await fbGet(`quiz/${code}/players`)||{};
    const mx=qTime(Q[qi])*1000;
    Object.entries(a).forEach(([id,ans])=>{
      if(p[id]&&ans.pick===Q[qi].c){const b=Math.max(0,Math.round(MAXP*(1-ans.timeMs/mx)));p[id].delta=b;p[id].score=(p[id].score||0)+b}
      else if(p[id])p[id].delta=0;
    });
    Object.keys(p).forEach(id=>{if(!a[id]&&p[id])p[id].delta=0});
    await fbSet(`quiz/${code}/players`,p);
    await fbSet(`quiz/${code}/state`,{phase:"reveal",currentQ:qi,startTime:qStart.current});
    setPlayers(p);setPhase("reveal");
  };
  const hostLB=async()=>{await fbSet(`quiz/${code}/state`,{phase:"leaderboard",currentQ:qi});setPhase("leaderboard")};
  const hostRevealNext=async()=>{
    if(qi+1>=Q.length){
      const archived=Object.fromEntries(Object.entries(players).map(([id,p])=>[id,{name:p.name,avatar:p.avatar,score:p.score||0}]));
      await fbSet(`results/${code}_${Date.now()}`,{code,endedAt:Date.now(),numQuestions:Q.length,quizName:activeQuiz?.name||"",players:archived});
      setClosingStep(0);
      await fbSet(`quiz/${code}/state`,{phase:"closing",currentQ:qi,msgStep:0});
      setPhase("closing");
    }
    else hostLB();
  };
  const hostNext=async()=>{
    if(qi+1>=Q.length){
      await fbSet(`quiz/${code}/state`,{phase:"final",currentQ:qi});
      setPhase("final");
    }
    else hostStartQ(qi+1);
  };
  const hostClosingNext=async()=>{
    if(closingStep>=CLOSING_MSGS.length-1){
      hostLB();
    }else{
      const next=closingStep+1;
      setClosingStep(next);
      await fbSet(`quiz/${code}/state`,{phase:"closing",currentQ:qi,msgStep:next});
    }
  };

  // Player
  const playerJoin=async()=>{
    if(!joinCode||joinCode.length!==4){setErr("Enter a 4-digit code");return}
    if(!name.trim()){setErr("Enter your name");return}
    const st=await fbGet(`quiz/${joinCode}/state`);
    if(!st){setErr("Session not found");return}
    const p=await fbGet(`quiz/${joinCode}/players`)||{};
    if(Object.values(p).some(x=>x.name?.toLowerCase()===name.trim().toLowerCase())){setErr("Name taken");return}
    const me={name:name.trim(),avatar:avIdx,score:0,delta:0};
    await fbSet(`quiz/${joinCode}/players/${pid}`,me);
    setCode(joinCode);setRole("player");setPlayers({...p,[pid]:me});setPhase("lobby");
    unsubs.current.push(fbOn(`quiz/${joinCode}/state`,s=>{if(s)setGState(s)}));
    unsubs.current.push(fbOn(`quiz/${joinCode}/players`,pl=>{if(pl)setPlayers(pl)}));
  };
  const playerSelect=(pick)=>{if(sent||tl<=0)return;setMyPick(pick)};
  const playerConfirm=async()=>{
    if(sent||myPick===null)return;setSent(true);
    const elapsed=Date.now()-(gState?.startTime||0);
    await fbSet(`quiz/${code}/ans_${gState?.currentQ}/${pid}`,{pick:myPick,timeMs:elapsed});
  };

  // Player state sync
  useEffect(()=>{
    if(role!=="player"||!gState)return;
    const gp=gState.phase;
    if(gp!==prevP.current){
      prevP.current=gp;
      if(gp==="question"){
        setQi(gState.currentQ);setMyPick(null);setSent(false);setPhase("question");
        qStart.current=gState.startTime;
        const myQuiz=quizzes?((gState.quizId&&quizzes[gState.quizId])?quizzes[gState.quizId]:Object.values(quizzes)[0]):null;
        setTl(qTime(myQuiz&&myQuiz.questions[gState.currentQ]));
        stopT();tRef.current=setInterval(()=>setTl(t=>{if(t<=1){clearInterval(tRef.current);return 0}return t-1}),1000);
      }
      if(gp==="reveal"){stopT();setQi(gState.currentQ);setPhase("reveal")}
      if(gp==="leaderboard")setPhase("leaderboard");
      if(gp==="closing")setPhase("closing");
      if(gp==="final")setPhase("final");
    }
  },[gState,role]);

  if(!quizzes)return <BrandBg><div style={{textAlign:"center"}}><Logo size={40}/><p style={{color:"rgba(27,20,100,.45)",marginTop:24}}>Loading…</p></div></BrandBg>;

  // Host picks the quiz from the landing screen; a player inherits whichever quiz
  // the host started the session with, via the synced game state. Fall back to the
  // first available quiz if the session's quizId is missing/stale (e.g. a host tab
  // still running cached pre-multi-quiz code) so a player never gets stuck on an
  // empty question set.
  const activeQuizId=urlMode==="host"?selectedQuizId:(gState?.quizId||null);
  const activeQuiz=(activeQuizId&&quizzes[activeQuizId])?quizzes[activeQuizId]:(Object.values(quizzes)[0]||null);
  const Q=activeQuiz?activeQuiz.questions:[];
  const question=Q.length?Q[Math.min(qi,Q.length-1)]:null;
  const L=["A","B","C","D"],colors=[TK.bad,"#3B82F6",TK.orange,TK.ok];

  // ═══ SCREENS ═══
  // HOST LANDING
  if(phase==="choose"&&urlMode==="host")return(
    <BrandBg><div style={{maxWidth:560,margin:"0 auto",textAlign:"center"}}>
      <Logo size={40}/>
      <div style={{marginTop:64}}>
        <h1 style={{fontSize:52,fontWeight:800,lineHeight:1.1,fontFamily:"Georgia,serif",color:TK.orange,textTransform:"uppercase",letterSpacing:".02em"}}>AI Quiz</h1>
        <p style={{fontSize:14,fontWeight:600,color:"rgba(27,20,100,.35)",marginTop:12,letterSpacing:".1em",textTransform:"uppercase"}}>Host Dashboard</p>
      </div>
      <div style={{marginTop:40,textAlign:"left",maxWidth:400,margin:"40px auto 0"}}>
        <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:10,textAlign:"center"}}>Select a Quiz</label>
        {Object.keys(quizzes).length===0?<p style={{textAlign:"center",color:TK.grey,fontSize:14,fontStyle:"italic"}}>No quizzes yet — create one from the admin page.</p>:
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {Object.values(quizzes).map(qz=>
            <button key={qz.id} onClick={()=>setSelectedQuizId(qz.id)} style={{textAlign:"left",padding:"14px 18px",borderRadius:10,border:selectedQuizId===qz.id?`2px solid ${TK.orange}`:"1.5px solid rgba(27,20,100,.12)",background:selectedQuizId===qz.id?"rgba(255,102,51,.06)":"#fff",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontWeight:600,color:TK.navy,fontSize:15}}>{qz.name}</span>
              <span style={{fontSize:12,color:TK.grey,flexShrink:0,marginLeft:12}}>{qz.questions.length} question{qz.questions.length!==1?"s":""}</span>
            </button>
          )}
        </div>}
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:20,marginTop:28}}>
        {[{l:"Geopolitics",c:"#E21B3C",match:x=>x.cat==="Geopolitics"},{l:"Market",c:"#26890C",match:x=>x.cat==="Market"},{l:"Internal",c:TK.orange,match:x=>x.cat!=="Geopolitics"&&x.cat!=="Market"}].map((s,i)=>
          <div key={i} style={{padding:"16px 20px",borderRadius:12,background:"rgba(27,20,100,.04)",border:"1px solid rgba(27,20,100,.08)",minWidth:100}}>
            <div style={{fontSize:28,fontWeight:800,color:s.c}}>{Q.filter(s.match).length}</div>
            <div style={{fontSize:12,color:"rgba(27,20,100,.4)",marginTop:3}}>{s.l}</div>
          </div>
        )}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginTop:36,maxWidth:340,margin:"36px auto 0"}}>
        <Btn onClick={hostCreate} disabled={!selectedQuizId}>Start a Session</Btn>
        <Btn outline onClick={()=>window.location.search=`?review&quiz=${selectedQuizId}`} disabled={!selectedQuizId}>Review Questions</Btn>
      </div>
    </div></BrandBg>
  );

  // PLAYER LANDING — straight to join form
  if(phase==="choose"&&urlMode==="player")return(
    <BrandBg top><div style={{maxWidth:420,margin:"0 auto",textAlign:"center"}}>
      <Logo size={30}/>
      <div style={{marginTop:20}}>
        <h1 style={{fontSize:32,fontWeight:800,lineHeight:1.1,fontFamily:"Georgia,serif",color:TK.orange,textTransform:"uppercase"}}>AI Quiz</h1>
        <p style={{fontSize:14,color:"rgba(27,20,100,.4)",marginTop:6}}>Enter the session code to join</p>
      </div>
      <div style={{marginTop:18,textAlign:"left"}}>
        <div style={{marginBottom:10}}>
          <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".08em"}}>Session Code</label>
          <input value={joinCode} onChange={e=>{setJoinCode(e.target.value.replace(/\D/g,"").slice(0,4));setErr("")}} placeholder="4-digit code" maxLength={4} style={{width:"100%",marginTop:6,padding:"12px 16px",borderRadius:10,fontSize:24,fontWeight:700,textAlign:"center",letterSpacing:".3em",background:"rgba(27,20,100,.04)",border:"1.5px solid rgba(27,20,100,.12)",color:TK.navy,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:10}}>
          <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".08em"}}>Your Name</label>
          <input value={name} onChange={e=>{setName(e.target.value.slice(0,20));setErr("")}} placeholder="Enter your name" maxLength={20} style={{width:"100%",marginTop:6,padding:"10px 14px",borderRadius:10,fontSize:16,background:"rgba(27,20,100,.04)",border:"1.5px solid rgba(27,20,100,.12)",color:TK.navy,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div>
          <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:8}}>Pick Your Avatar</label>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6}}>
            {AVATARS.map((a,i)=><button key={i} onClick={()=>setAvIdx(i)} style={{width:59,height:59,borderRadius:12,border:i===avIdx?`2px solid ${TK.orange}`:"2px solid transparent",background:"transparent",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:i===avIdx?`0 0 16px ${TK.orange}44`:"none"}}><img src={a.img} style={{width:44,height:44,objectFit:"contain"}}/></button>)}
          </div>
        </div>
      </div>
      {err&&<p style={{color:TK.bad,fontSize:13,marginTop:8,textAlign:"center"}}>{err}</p>}
      <div style={{marginTop:18,textAlign:"center"}}><Btn onClick={()=>{setRole("player");playerJoin()}} disabled={!joinCode||joinCode.length<4||!name.trim()}>Join Quiz</Btn></div>
    </div></BrandBg>
  );


  if(phase==="lobby"&&role==="host")return(<Wrap w={600}><div style={{textAlign:"center"}}><Logo size={28}/><div style={{marginTop:36,padding:"32px 24px",borderRadius:20,background:"rgba(255,102,51,.08)",border:"1px solid rgba(255,102,51,.15)"}}><div style={{fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:".1em",color:TK.grey}}>Session Code</div><div style={{fontSize:64,fontWeight:800,letterSpacing:".25em",color:TK.orange,fontVariantNumeric:"tabular-nums",marginTop:8}}>{code}</div><p style={{fontSize:14,color:TK.grey,marginTop:8}}>Open this page and enter the code to join</p><div style={{marginTop:20,paddingTop:20,borderTop:"1px solid rgba(255,102,51,.15)",display:"flex",flexDirection:"column",alignItems:"center",gap:10}}><img src="qr-join.png" alt="QR code to join" style={{width:130,height:130,borderRadius:10,background:"#fff",padding:8,border:"1px solid rgba(27,20,100,.08)"}}/><a href="https://tinyurl.com/kcshu4sz" target="_blank" rel="noopener noreferrer" style={{fontSize:15,fontWeight:700,color:TK.orange,textDecoration:"none"}}>tinyurl.com/kcshu4sz</a></div></div><p style={{fontSize:13,color:TK.grey,marginTop:16,maxWidth:420,marginLeft:"auto",marginRight:"auto",lineHeight:1.5}}>🏆 Ranking is based on speed and accuracy — only correct answers score, and each one earns up to 1,000 points depending on how fast you answer.</p><div style={{marginTop:28}}><div style={{fontSize:13,fontWeight:600,color:TK.grey,textTransform:"uppercase",letterSpacing:".08em",marginBottom:14}}>{nPlayers} player{nPlayers!==1?"s":""}</div>{nPlayers===0?<p style={{color:TK.grey,fontSize:14,fontStyle:"italic"}}>Waiting for players…</p>:<div style={{display:"flex",flexWrap:"wrap",gap:12,justifyContent:"center"}}>{Object.values(players).map((p,i)=><div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"12px 16px",borderRadius:12,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)",minWidth:80}}><Av i={p.avatar} size={40}/><span style={{fontSize:13,fontWeight:500,color:TK.navy}}>{p.name}</span></div>)}</div>}</div><div style={{marginTop:36}}><Btn onClick={()=>hostStartQ(0)} disabled={nPlayers===0}>Start Quiz →</Btn></div></div></Wrap>);

  if(phase==="lobby"&&role==="player")return(<Wrap w={440}><div style={{textAlign:"center"}}><Logo size={28}/><div style={{marginTop:40}}><Av i={avIdx} size={64}/></div><h2 style={{fontSize:22,fontWeight:400,fontFamily:"Georgia,serif",marginTop:16}}>{name}</h2><p style={{color:TK.grey,fontSize:14,marginTop:4}}>Session <span style={{color:TK.orange,fontWeight:700}}>{code}</span></p><div style={{marginTop:32,padding:"20px",borderRadius:14,background:"rgba(27,20,100,.02)",border:"1px solid rgba(27,20,100,.08)"}}><div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>{Object.values(players).map((p,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,background:"rgba(27,20,100,.04)"}}><img src={AVATARS[p.avatar]?.img} style={{width:18,height:18,objectFit:"contain"}}/><span style={{fontSize:13,color:"#6B6A80"}}>{p.name}</span></div>)}</div></div><div style={{marginTop:36}}><div className="spinner"/></div><p style={{color:TK.grey,fontSize:14,marginTop:12}}>Waiting for the host…</p></div></Wrap>);

  if(phase==="question"&&role==="host")return(<Wrap w={800}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><Logo size={24}/><div style={{display:"flex",alignItems:"center",gap:14}}><span style={{fontSize:12,fontWeight:600,color:TK.navy,padding:"3px 10px",borderRadius:6,background:TK.orange}}>{question.cat}</span><span style={{fontSize:14,color:TK.grey}}>Q{qi+1}/{Q.length}</span></div></div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:12,color:TK.grey}}>Question {qi+1}</span><span style={{fontSize:28,fontWeight:800,color:tl<=5?TK.bad:TK.white,fontVariantNumeric:"tabular-nums"}}>{tl}</span></div><TBar tl={tl} mx={qTime(question)}/><div style={{display:"flex",gap:20,marginTop:20,alignItems:"stretch"}}><div style={{flex:1,padding:"28px",borderRadius:16,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)",display:"flex",alignItems:"center"}}><h2 style={{fontSize:26,fontWeight:400,lineHeight:1.45,margin:0,fontFamily:"Georgia,serif"}}>{question.q}</h2></div><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,justifyContent:"center"}}><QImg qi={qi} size={130}/><LiveCounter answered={nAnswers} total={nPlayers}/></div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}}>{question.o.map((o,i)=><div key={i} style={{padding:"20px 18px",borderRadius:14,background:`${colors[i]}12`,border:`1.5px solid ${colors[i]}33`,display:"flex",alignItems:"center",gap:12}}><span style={{width:36,height:36,borderRadius:10,background:colors[i],color:TK.navy,fontWeight:800,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>{L[i]}</span><span style={{fontSize:16,color:TK.navy,lineHeight:1.4}}>{o}</span></div>)}</div><div style={{textAlign:"center",marginTop:24}}><Btn onClick={hostReveal}>Reveal Answer</Btn></div></Wrap>);

  if(phase==="question"&&role==="player"){const gqi=gState?.currentQ??0,pq=Q[gqi];return(<Wrap w={420}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontSize:13,fontWeight:600,color:TK.navy}}>Q{gqi+1}/{Q.length}</span><span style={{fontSize:24,fontWeight:800,color:tl<=5?TK.bad:TK.navy,fontVariantNumeric:"tabular-nums"}}>{tl}</span></div><TBar tl={tl} mx={qTime(pq)}/><p style={{fontSize:11,color:TK.grey,textAlign:"center",marginTop:8}}>⚡ Faster correct answers score more points</p><div style={{padding:"16px",borderRadius:12,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)",marginTop:10,marginBottom:16}}><h2 style={{fontSize:17,fontWeight:400,lineHeight:1.45,margin:0,fontFamily:"Georgia,serif",color:TK.navy}}>{pq.q}</h2></div><PlayerOptions options={pq.o} colors={colors} L={L} onPick={(i)=>playerSelect(i)} picked={myPick} disabled={sent||tl<=0}/>{myPick!==null&&!sent&&tl>0&&<div style={{marginTop:16,textAlign:"center"}}><Btn onClick={playerConfirm}>Confirm Answer</Btn></div>}{sent?<div style={{textAlign:"center",marginTop:20,padding:"14px",borderRadius:12,background:"rgba(27,20,100,.04)",border:"1px solid rgba(27,20,100,.08)"}}><span style={{fontSize:24}}>✓</span><p style={{fontSize:14,color:TK.grey,margin:"6px 0 0"}}>Locked in — waiting for reveal</p></div>:tl<=0?<div style={{textAlign:"center",marginTop:20,padding:"14px",borderRadius:12,background:TK.badBg,border:`1px solid ${TK.bad}33`}}><span style={{fontSize:24}}>⏱</span><p style={{fontSize:14,color:TK.bad,fontWeight:600,margin:"6px 0 0"}}>Time's up!</p></div>:null}</Wrap>)}

  if(phase==="reveal"&&role==="host")return(<Wrap w={1000}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><Logo size={24}/><div style={{display:"flex",alignItems:"center",gap:12}}><div style={{padding:"8px 14px",borderRadius:8,background:"rgba(27,20,100,.04)",border:"1px solid rgba(27,20,100,.08)",fontSize:13,color:TK.grey}}>👥 {nAnswers}/{nPlayers} answered</div><span style={{fontSize:12,fontWeight:600,color:"#fff",padding:"3px 10px",borderRadius:6,background:TK.orange}}>Reveal</span></div></div>
    <div style={{display:"flex",gap:24,alignItems:"flex-start"}}>
      {/* LEFT: question + options */}
      <div style={{flex:"1 1 55%",minWidth:0}}>
        <div style={{padding:"20px 24px",borderRadius:16,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)"}}><h2 style={{fontSize:22,fontWeight:400,lineHeight:1.45,margin:0,fontFamily:"Georgia,serif"}}>{question.q}</h2></div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:14}}>
          {question.o.map((o,i)=>{const isC=i===question.c;const barW=nAnswers>0?Math.max(4,(dist[i]/nAnswers)*100):0;return <div key={i} className={isC?"reveal-glow":""} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",borderRadius:12,background:isC?TK.okBg:"rgba(27,20,100,.03)",border:`1.5px solid ${isC?TK.ok:"rgba(27,20,100,.1)"}`,color:isC?TK.ok:TK.navy,position:"relative",overflow:"hidden",transition:"all .4s ease"}}><div style={{position:"absolute",left:0,top:0,bottom:0,width:`${barW}%`,background:isC?"rgba(52,211,153,.1)":"rgba(27,20,100,.03)",transition:"width .8s ease"}} /><span style={{width:32,height:32,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:isC?TK.ok:"rgba(27,20,100,.06)",color:isC?"#fff":"#6B6A80",fontWeight:700,fontSize:13,position:"relative",transition:"all .3s"}}>{L[i]}</span><span style={{flex:1,lineHeight:1.4,position:"relative",fontWeight:isC?600:400}}>{o}</span>{dist[i]>0&&<span style={{fontSize:14,fontWeight:700,color:isC?TK.ok:TK.grey,position:"relative",background:isC?"rgba(52,211,153,.1)":"rgba(27,20,100,.04)",padding:"2px 10px",borderRadius:6}}>{dist[i]}</span>}</div>})}
        </div>
      </div>
      {/* RIGHT: image + explanation + source — slides in */}
      <div style={{flex:"1 1 42%",minWidth:0}}>
        <div className="slide-r sr1" style={{display:"flex",alignItems:"center",gap:16,marginBottom:16}}>
          <QImg qi={qi} size={80}/>
          <div>
            <div style={{fontSize:12,fontWeight:600,color:TK.orange,textTransform:"uppercase",letterSpacing:".1em"}}>{question.cat}</div>
            <div style={{fontSize:13,color:TK.grey,marginTop:2}}>Question {qi+1} of {Q.length}</div>
          </div>
        </div>
        <div className="slide-r sr2" style={{padding:"18px 20px",borderRadius:14,background:"rgba(255,102,51,.06)",border:"1px solid rgba(255,102,51,.12)"}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:TK.orange,marginBottom:8}}>✓ Answer</div>
          <div style={{fontSize:16,fontWeight:600,lineHeight:1.5,color:TK.navy}}>{question.o[question.c]}</div>
          <div style={{marginTop:10,fontSize:14,lineHeight:1.6,color:"#5A596E"}}>{question.ex}</div>
        </div>
        <div className="slide-r sr3"><SCard q={question}/></div>
        <div className="slide-r sr4" style={{textAlign:"center",marginTop:20}}><Btn onClick={hostRevealNext}>{qi+1>=Q.length?"Continue →":"Show Leaderboard →"}</Btn></div>
      </div>
    </div>
  </Wrap>);

  if(phase==="reveal"&&role==="player"){const gqi=gState?.currentQ??0,pq=Q[gqi],ok=myPick===pq.c,me=players[pid];return(<Wrap w={440}><div style={{textAlign:"center",marginTop:20}}><div style={{fontSize:64,marginBottom:12}}>{ok?"🎉":myPick===null?"⏱":"😬"}</div><h2 style={{fontSize:26,fontWeight:400,fontFamily:"Georgia,serif",color:ok?TK.ok:(myPick===null?TK.grey:TK.bad)}}>{ok?"Correct!":myPick===null?"Time's up":"Not quite"}</h2>{ok&&me&&<p style={{fontSize:18,fontWeight:700,color:TK.orange,marginTop:8}}>+{me.delta} pts</p>}<div style={{textAlign:"left",marginTop:16}}><div style={{padding:"14px 18px",borderRadius:12,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)"}}><div style={{fontSize:14,color:TK.ok,fontWeight:600}}>Answer: {pq.o[pq.c]}</div><p style={{fontSize:13,color:TK.grey,marginTop:8,lineHeight:1.5}}>{pq.ex}</p></div><SCard q={pq}/></div><div style={{marginTop:24}}><div className="spinner"/><p style={{color:TK.grey,fontSize:13,marginTop:8}}>Waiting for the host…</p></div></div></Wrap>)}

  if(phase==="leaderboard"){
    const sortedLB=Object.entries(players).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0));
    const myRankLB=role==="player"?sortedLB.findIndex(p=>p.id===pid)+1:0;
    return(<Wrap w={700}><div style={{textAlign:"center"}}><Logo size={24}/><h2 className="fi" style={{fontSize:28,fontWeight:300,fontFamily:"Georgia,serif",marginTop:24,color:TK.navy}}>Leaderboard</h2><p className="fi d1" style={{fontSize:13,color:TK.grey}}>After question {qi+1} of {Q.length} · {Object.keys(players).length} players</p>{role==="player"&&myRankLB>0&&<div className="fi d2" style={{display:"inline-flex",alignItems:"center",gap:8,marginTop:12,padding:"8px 18px",borderRadius:999,background:"rgba(255,102,51,.1)",border:"1px solid rgba(255,102,51,.25)"}}><span style={{fontSize:13,color:TK.grey}}>Your rank</span><span style={{fontSize:16,fontWeight:800,color:TK.orange}}>#{myRankLB}</span><span style={{fontSize:13,color:TK.grey}}>of {sortedLB.length}</span></div>}{role==="player"&&<p className="fi d3" style={{fontSize:12,color:TK.grey,marginTop:10,maxWidth:340,marginLeft:"auto",marginRight:"auto",lineHeight:1.5}}>Ranked by total points. Each correct answer earns up to 1,000 points — the faster you answer, the more you score.</p>}</div><div style={{marginTop:24}}><LBoard players={players} myId={role==="player"?pid:null}/></div>{role==="host"&&<div className="fi d5" style={{textAlign:"center",marginTop:28}}><Btn onClick={hostNext}>{qi+1>=Q.length?"Final Results →":"Next Question →"}</Btn></div>}{role==="player"&&qi+1<Q.length&&<div style={{textAlign:"center",marginTop:24}}><div className="spinner"/><p style={{color:TK.grey,fontSize:13,marginTop:8}}>Next question…</p></div>}</Wrap>);
  }

  if(phase==="closing"&&role==="host")return(<Wrap w={640}><div key={closingStep} className="fi" style={{textAlign:"center"}}><Logo size={24}/><div style={{display:"flex",justifyContent:"center",gap:8,marginTop:28}}>{CLOSING_MSGS.map((_,i)=><div key={i} style={{width:i===closingStep?24:8,height:8,borderRadius:4,background:i<=closingStep?TK.orange:"rgba(27,20,100,.12)",transition:"all .3s ease"}}/>)}</div><div style={{fontSize:12,fontWeight:600,color:TK.grey,textTransform:"uppercase",letterSpacing:".1em",marginTop:16}}>Message {closingStep+1} of {CLOSING_MSGS.length}</div>{CLOSING_MSGS[closingStep].title&&<h2 style={{fontSize:30,fontWeight:400,fontFamily:"Georgia,serif",color:TK.navy,marginTop:16,lineHeight:1.3}}>{CLOSING_MSGS[closingStep].title}</h2>}<p style={CLOSING_MSGS[closingStep].title?{fontSize:16,color:"#5A596E",lineHeight:1.7,marginTop:18,maxWidth:520,marginLeft:"auto",marginRight:"auto"}:{fontSize:26,fontWeight:400,fontFamily:"Georgia,serif",color:TK.navy,lineHeight:1.5,marginTop:22,maxWidth:520,marginLeft:"auto",marginRight:"auto"}}>{CLOSING_MSGS[closingStep].body}</p><div style={{marginTop:36}}><Btn onClick={hostClosingNext}>{closingStep>=CLOSING_MSGS.length-1?"See Final Results →":"Next →"}</Btn></div></div></Wrap>);

  if(phase==="closing"&&role==="player"){const step=gState?.msgStep??0;return(<Wrap w={480}><div key={step} className="fi" style={{textAlign:"center"}}><Logo size={24}/><div style={{display:"flex",justifyContent:"center",gap:8,marginTop:28}}>{CLOSING_MSGS.map((_,i)=><div key={i} style={{width:i===step?24:8,height:8,borderRadius:4,background:i<=step?TK.orange:"rgba(27,20,100,.12)",transition:"all .3s ease"}}/>)}</div>{CLOSING_MSGS[step].title&&<h2 style={{fontSize:24,fontWeight:400,fontFamily:"Georgia,serif",color:TK.navy,marginTop:20,lineHeight:1.3}}>{CLOSING_MSGS[step].title}</h2>}<p style={CLOSING_MSGS[step].title?{fontSize:15,color:"#5A596E",lineHeight:1.7,marginTop:14}:{fontSize:20,fontWeight:400,fontFamily:"Georgia,serif",color:TK.navy,lineHeight:1.5,marginTop:20}}>{CLOSING_MSGS[step].body}</p></div></Wrap>)}

  if(phase==="final"){const sorted=Object.entries(players).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0));const w=sorted[0];const me=role==="player"?sorted.find(p=>p.id===pid):null;const mr=me?sorted.indexOf(me)+1:0;return(<Wrap w={560}><div style={{textAlign:"center"}}><Logo size={28}/><div style={{fontSize:48,marginTop:32}}>🏆</div><h2 style={{fontSize:32,fontWeight:300,fontFamily:"Georgia,serif",marginTop:12}}>{role==="player"&&mr===1?"You won!":role==="player"?`#${mr}`:"Final Results"}</h2>{w&&<div style={{marginTop:16,display:"inline-flex",alignItems:"center",gap:10,padding:"12px 24px",borderRadius:14,background:"rgba(255,102,51,.1)",border:"1px solid rgba(255,102,51,.2)"}}><Av i={w.avatar} size={44}/><div style={{textAlign:"left"}}><div style={{fontSize:18,fontWeight:600,color:TK.orange}}>{w.name}</div><div style={{fontSize:14,color:TK.grey}}>{w.score} pts</div></div></div>}</div><div style={{marginTop:28}}><LBoard players={players} showD={false} myId={role==="player"?pid:null}/></div>{role==="host"&&<div style={{textAlign:"center",marginTop:28}}><Btn outline onClick={()=>{fbDel(`quiz/${code}`);cleanup();setPhase("choose");setRole(null);setPlayers({});setAnswers({})}}>End Session</Btn></div>}</Wrap>)}

  return <Wrap><p style={{color:TK.grey,textAlign:"center"}}>Loading…</p></Wrap>;
}
function NotConfigured(){
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"system-ui,sans-serif",background:"#FAF6F1",padding:24,textAlign:"center"}}><div><h1 style={{color:"#1B1464",fontSize:20,marginBottom:8}}>Firebase not configured</h1><p style={{color:"#57534C",fontSize:14,maxWidth:420}}>Paste your Firebase project config into the <code>FIREBASE_CONFIG</code> object near the top of index.html. See README.md for setup steps.</p></div></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(FIREBASE_CONFIGURED?<App/>:<NotConfigured/>);
</script>
</body>
</html>
