    <svg style={{position:"absolute",top:0,right:0,width:"45%",height:"100%",opacity:1}} viewBox="0 0 400 800" fill="none" preserveAspectRatio="none">
      <path d="M400 0 C250 0,200 150,250 300 C300 450,150 500,200 700 C220 780,350 800,400 800 Z" fill="#E8DFD3"/>
    </svg>
    <svg style={{position:"absolute",bottom:0,left:0,width:"30%",height:"60%",opacity:1}} viewBox="0 0 300 500" fill="none" preserveAspectRatio="none">

function Logo({size=28}){return <div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:size,height:size,borderRadius:4,background:`linear-gradient(135deg,${TK.orange},${TK.orangeD})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.4,fontWeight:800,color:TK.navy,fontFamily:"Georgia,serif"}}>AI</div><span style={{fontSize:size*.45,fontWeight:600,letterSpacing:".1em",textTransform:"uppercase",color:TK.orange}}>Quiz</span></div>}
function Av({i,size=48}){const a=AVATARS[i]||AVATARS[0];return <div style={{width:size,height:size,borderRadius:size*.3,background:a.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.5,boxShadow:`0 2px 12px ${a.bg}44`}}>{a.emoji}</div>}
function Btn({children,onClick,disabled,outline}){return <button onClick={onClick} disabled={disabled} style={{padding:"14px 44px",borderRadius:10,fontWeight:700,fontSize:16,border:outline?`1.5px solid ${TK.orange}`:"none",cursor:disabled?"default":"pointer",background:outline?"transparent":`linear-gradient(135deg,${TK.orange},${TK.orangeD})`,color:outline?TK.orange:TK.navy,opacity:disabled?.4:1,boxShadow:outline?"none":"0 4px 20px rgba(255,102,51,.25)"}}>{children}</button>}
function Wrap({children,w=640}){return <div style={{minHeight:"100vh",background:"#FAF6F1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"20px 16px"}}><div style={{width:"100%",maxWidth:w}}>{children}</div></div>}
function TBar({tl,mx}){const p=(tl/mx)*100,cl=tl<=5?TK.bad:tl<=10?TK.orangeL:TK.orange;return <div style={{width:"100%",height:8,borderRadius:4,background:"rgba(27,20,100,.06)",overflow:"hidden"}}><div style={{width:`${p}%`,height:"100%",borderRadius:4,background:cl,transition:"width 1s linear"}}/></div>}
function SCard({q}){const s=SRCS[q.st]||SRCS.bcg;return <div className="fi d5" style={{marginTop:16,borderRadius:14,overflow:"hidden",border:`1px solid ${s.color}25`}}><div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 18px",background:`${s.color}12`}}><span style={{fontSize:18}}>{s.icon}</span><div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:s.color}}>{s.label}</div><div style={{fontSize:12,color:TK.grey,marginTop:1}}>{q.sd}</div></div></div><div style={{padding:"10px 18px",borderBottom:`1px solid ${s.color}12`}}><div style={{fontSize:13,color:"#5A596E",lineHeight:1.5,fontStyle:"italic"}}>{q.s}</div></div><div style={{padding:"14px 18px",background:"rgba(27,20,100,.06)"}}><div style={{fontSize:15,color:TK.navy,lineHeight:1.6,fontWeight:500}}>{q.xt}</div></div></div>}
function LBoard({players,showD=true}){
  const sorted=Object.entries(players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0));
  const top3=sorted.slice(0,3);
  const rest=sorted.slice(3);
  const m=["🥇","🥈","🥉"];
  const podColors=[TK.orange,"#6B6A80","#A0785A"];
  const podSizes=[72,56,52];

  return <div>
    {/* Podium for top 3 */}
    {top3.length>0&&<div style={{display:"flex",justifyContent:"center",alignItems:"flex-end",gap:16,marginBottom:28,paddingTop:16}}>
      {[1,0,2].map((rank)=>{
        const p=top3[rank];if(!p)return <div key={rank} style={{width:120}}/>;
        const av=AVATARS[p.avatar]||AVATARS[0];
        const isFirst=rank===0;
        const delay=rank===0?.3:rank===1?.1:.5;
        return <div key={p.id} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,animation:`podiumRise .6s cubic-bezier(.22,1,.36,1) ${delay}s both`,width:isFirst?140:115}}>
          {isFirst&&<div style={{fontSize:28,animation:"crownBounce .5s cubic-bezier(.22,1,.36,1) .8s both"}}>👑</div>}
          <div style={{position:"relative"}}>
            <div style={{width:podSizes[rank],height:podSizes[rank],borderRadius:podSizes[rank]*.3,background:av.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:podSizes[rank]*.45,boxShadow:`0 4px 20px ${av.bg}44`,border:isFirst?`3px solid ${TK.orange}`:"3px solid transparent"}}>{av.emoji}</div>
          </div>
          <span style={{fontSize:isFirst?16:14,fontWeight:600,color:TK.navy,textAlign:"center"}}>{p.name}</span>
          <div style={{animation:`countUp .4s ease ${delay+.3}s both`}}>
            <span style={{fontSize:isFirst?24:18,fontWeight:800,color:podColors[rank]}}>{p.score||0}</span>
            {showD&&p.delta>0&&<span style={{fontSize:12,fontWeight:600,color:TK.ok,marginLeft:6}}>+{p.delta}</span>}
          </div>
          <div style={{width:"100%",height:isFirst?80:rank===1?56:44,borderRadius:"10px 10px 0 0",marginTop:4,
            background:isFirst?`linear-gradient(180deg,${TK.orange},${TK.orangeD})`:`linear-gradient(180deg,rgba(27,20,100,${rank===1?.12:.08}),rgba(27,20,100,${rank===1?.06:.04}))`,
            display:"flex",alignItems:"center",justifyContent:"center",
            animation:`podiumRise .5s cubic-bezier(.22,1,.36,1) ${delay+.15}s both`}}>
            <span style={{fontSize:isFirst?28:22,fontWeight:800,color:isFirst?"#fff":"rgba(27,20,100,.3)"}}>{rank+1}</span>
          </div>
        </div>
      })}
    </div>}

    {/* Remaining rows */}
    <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:rest.length>15?"420px":"none",overflowY:rest.length>15?"auto":"visible",paddingRight:rest.length>15?4:0}}>
      {rest.map((p,i)=>{
        const av=AVATARS[p.avatar]||AVATARS[0];
        const rank=i+4;
        const delay=Math.min(.8+i*.06,2.5);
        return <div key={p.id} style={{
          display:"flex",alignItems:"center",gap:12,padding:"10px 14px",borderRadius:10,
          background:i%2===0?"rgba(27,20,100,.02)":"transparent",
          border:"1px solid rgba(27,20,100,.04)",
          animation:`slideUp .4s cubic-bezier(.22,1,.36,1) ${delay}s both`,
        }}>
          <span style={{width:28,textAlign:"center",fontSize:13,fontWeight:700,color:TK.grey}}>{rank}</span>
          <div style={{width:32,height:32,borderRadius:8,background:av.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>{av.emoji}</div>
          <span style={{flex:1,fontSize:14,fontWeight:500,color:TK.navy}}>{p.name}</span>
          {showD&&p.delta>0&&<span style={{fontSize:12,fontWeight:600,color:TK.ok,marginRight:6}}>+{p.delta}</span>}
          <span style={{fontSize:16,fontWeight:700,color:TK.orange,minWidth:50,textAlign:"right"}}>{p.score||0}</span>
        </div>
      })}
    </div>
  </div>
}

function PlayerOptions({options,colors,L,onPick,picked,disabled}){
  return <div style={{display:"flex",flexDirection:"column",gap:10,width:"100%"}}>
    {options.map((o,i)=>{
      const isPicked=picked===i;
      return <button key={i} onClick={()=>!disabled&&onPick(i)} disabled={disabled} style={{
        display:"flex",alignItems:"center",gap:12,padding:"16px 18px",borderRadius:14,width:"100%",boxSizing:"border-box",
        background:`${colors[i]}12`,border:isPicked?`2px solid ${colors[i]}`:`1.5px solid ${colors[i]}33`,
        textAlign:"left",transition:"all .2s ease",
        boxShadow:isPicked?`0 0 0 3px ${colors[i]}33`:"none",
        opacity:disabled&&!isPicked?.5:1,
      }}>
        <span style={{width:36,height:36,borderRadius:10,background:colors[i],color:TK.navy,fontWeight:800,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{L[i]}</span>
        <span style={{fontSize:15,color:TK.navy,lineHeight:1.4,fontWeight:isPicked?600:400}}>{o}</span>
      </button>
    })}
  </div>
}

function ReviewMode(){
  const [rqi,setRqi]=useState(0);
  const [showAnswer,setShowAnswer]=useState(false);
  const q=Q[rqi];
  const L=["A","B","C","D"];

  const goPrev=()=>{if(rqi>0){setShowAnswer(false);setRqi(r=>r-1)}};
  const goNext=()=>{if(rqi<Q.length-1){setShowAnswer(false);setRqi(r=>r+1)}};

  useEffect(()=>{
    const h=(e)=>{if(e.key==="ArrowLeft")goPrev();if(e.key==="ArrowRight")goNext();if(e.key===" "||e.key==="Enter"){e.preventDefault();setShowAnswer(v=>!v)}};
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  });

  return <div style={{minHeight:"100vh",background:"#FAF6F1",padding:"20px"}}>
    <div style={{maxWidth:1100,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <TKOLogo scale={.8}/>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:12,fontWeight:600,color:"#fff",padding:"3px 10px",borderRadius:6,background:TK.orange}}>{q.cat}</span>
          <span style={{fontSize:14,color:TK.grey}}>Review Mode · {rqi+1}/{Q.length}</span>
        </div>
      </div>

      <div style={{display:"flex",gap:24,alignItems:"flex-start"}} key={rqi}>
        {/* LEFT: question + options */}
        <div style={{flex:"1 1 55%",minWidth:0}}>
          <div style={{background:"#fff",borderRadius:16,padding:24,border:"1px solid rgba(27,20,100,.08)"}}>
            <div style={{display:"flex",gap:16,alignItems:"center",marginBottom:20}}>
              <div style={{flex:1}}><h2 style={{fontSize:22,fontWeight:500,lineHeight:1.45,fontFamily:"Georgia,serif",color:TK.navy}}>{q.q}</h2></div>
              <QImg qi={rqi} size={80}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {q.o.map((o,i)=>{
                const isC=i===q.c;
                return <div key={i} style={{
                  display:"flex",alignItems:"center",gap:10,padding:"12px 14px",borderRadius:10,
                  background:showAnswer&&isC?"rgba(52,211,153,.12)":SHAPES[i].color+"15",
                  border:"2px solid "+(showAnswer&&isC?TK.ok:SHAPES[i].color+"33"),
                  transition:"all .3s ease",opacity:showAnswer&&!isC?.5:1,
                }}>
                  <span style={{width:30,height:30,borderRadius:8,background:SHAPES[i].color,color:"#fff",fontWeight:800,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{L[i]}</span>
                  <span style={{fontSize:14,color:TK.navy,lineHeight:1.4,fontWeight:showAnswer&&isC?700:400}}>{o}</span>
                  {showAnswer&&isC&&<span style={{marginLeft:"auto",color:TK.ok,fontWeight:700,fontSize:18}}>✓</span>}
                </div>
              })}
            </div>
          </div>
        </div>

        {/* RIGHT: answer panel */}
        <div style={{flex:"1 1 42%",minWidth:0}}>
          {!showAnswer
            ?<div style={{background:"#fff",borderRadius:16,padding:32,border:"1px solid rgba(27,20,100,.08)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:300,textAlign:"center"}}>
              <div style={{fontSize:48,marginBottom:16,opacity:.3}}>🔒</div>
              <p style={{fontSize:15,color:TK.grey}}>Press "Show Answer" or spacebar</p>
            </div>
            :<div className="slide-r sr1">
              <div style={{background:"#fff",borderRadius:16,padding:24,border:"1px solid rgba(27,20,100,.08)"}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:TK.orange,marginBottom:10}}>✓ Correct answer</div>
                <div style={{fontSize:18,fontWeight:700,lineHeight:1.4,color:TK.navy,marginBottom:14}}>{q.o[q.c]}</div>
                <div style={{fontSize:14,lineHeight:1.7,color:"#5A596E"}}>{q.ex}</div>
              </div>
              <div className="slide-r sr2"><SCard q={q}/></div>
            </div>
          }
        </div>
      </div>

      {/* Navigation */}
      <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:16,marginTop:24}}>
        <button onClick={goPrev} disabled={rqi===0} style={{padding:"10px 24px",borderRadius:8,background:"rgba(27,20,100,.06)",border:"1px solid rgba(27,20,100,.1)",color:TK.navy,fontWeight:600,fontSize:14,opacity:rqi===0?.3:1,cursor:rqi===0?"default":"pointer"}}>← Prev</button>
        <button onClick={()=>setShowAnswer(!showAnswer)} style={{padding:"10px 32px",borderRadius:8,background:showAnswer?"rgba(52,211,153,.1)":TK.orange,border:"none",color:showAnswer?TK.ok:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>{showAnswer?"Hide Answer":"Show Answer"}</button>
        <span style={{fontSize:15,fontWeight:700,color:TK.navy,minWidth:70,textAlign:"center"}}>{rqi+1} / {Q.length}</span>
        <button onClick={goNext} disabled={rqi===Q.length-1} style={{padding:"10px 24px",borderRadius:8,background:"rgba(27,20,100,.06)",border:"1px solid rgba(27,20,100,.1)",color:TK.navy,fontWeight:600,fontSize:14,opacity:rqi===Q.length-1?.3:1,cursor:rqi===Q.length-1?"default":"pointer"}}>Next →</button>
      </div>
      <div style={{textAlign:"center",marginTop:12}}><a href="?" style={{fontSize:13,color:TK.grey,textDecoration:"none"}}>← Back to quiz</a></div>
    </div>
  </div>
}

function App(){
  // URL routing: ?host → host landing, ?review → review mode, default → player landing
  const params=new URLSearchParams(window.location.search);
  const urlMode=params.has("review")?"review":params.has("host")?"host":"player";

  if(urlMode==="review")return <ReviewMode/>;

  if(DISABLED)return <BrandBg><div style={{maxWidth:400,margin:"0 auto",textAlign:"center"}}><TKOLogo/><h1 style={{fontSize:36,fontWeight:800,fontFamily:"Georgia,serif",marginTop:48,color:TK.orange,textTransform:"uppercase"}}>Coming Soon</h1><p style={{fontSize:15,color:"rgba(27,20,100,.45)",marginTop:14}}>The quiz will be activated during the seminar.</p><div style={{width:48,height:2,borderRadius:1,background:TK.orange,marginTop:32,opacity:.4,margin:"32px auto 0"}}/></div></BrandBg>;

  const [role,setRole]=useState(null);
  const [code,setCode]=useState("");
  const [pid]=useState(genId);
  const [name,setName]=useState("");
  const [avIdx,setAvIdx]=useState(0);
  const [phase,setPhase]=useState("choose");
  const [gState,setGState]=useState(null);
  const [players,setPlayers]=useState({});
  const [answers,setAnswers]=useState({});
  const [myPick,setMyPick]=useState(null);
  const [sent,setSent]=useState(false);
  const [tl,setTl]=useState(TSEC);
  const [joinCode,setJoinCode]=useState("");
  const [err,setErr]=useState("");
  const [qi,setQi]=useState(0);
  const tRef=useRef(null);
  const unsubs=useRef([]);
  const qStart=useRef(0);
  const prevP=useRef(null);

  const stopT=()=>{if(tRef.current){clearInterval(tRef.current);tRef.current=null}};
  const cleanup=()=>{stopT();unsubs.current.forEach(u=>u());unsubs.current=[]};
  useEffect(()=>()=>cleanup(),[]);

  const question=Q[qi];
  const nPlayers=Object.keys(players).length;
  const nAnswers=Object.keys(answers).length;
  const dist=[0,0,0,0];Object.values(answers).forEach(a=>{if(a.pick>=0&&a.pick<4)dist[a.pick]++});

  // Host
  const hostCreate=async()=>{
    const c=genCode();
    await fbSet(`quiz/${c}/state`,{phase:"lobby",currentQ:0,startTime:0});
    await fbSet(`quiz/${c}/players`,{});
    setCode(c);setRole("host");setPhase("lobby");
    unsubs.current.push(fbOn(`quiz/${c}/players`,p=>setPlayers(p||{})));
  };
  const hostStartQ=async(q)=>{
    const now=Date.now();qStart.current=now;
    setQi(q);setAnswers({});setPhase("question");setTl(tFor(q));
    await fbSet(`quiz/${code}/state`,{phase:"question",currentQ:q,startTime:now});
    await fbSet(`quiz/${code}/ans_${q}`,{});
    stopT();tRef.current=setInterval(()=>setTl(t=>{if(t<=1){clearInterval(tRef.current);return 0}return t-1}),1000);
    // listen answers
    const unsub=fbOn(`quiz/${code}/ans_${q}`,a=>setAnswers(a||{}));
    unsubs.current.push(unsub);
  };
  const hostReveal=async()=>{
    stopT();
    const a=await fbGet(`quiz/${code}/ans_${qi}`)||{};setAnswers(a);
    const p=await fbGet(`quiz/${code}/players`)||{};
    const mx=tFor(qi)*1000;
    Object.entries(a).forEach(([id,ans])=>{
      if(p[id]&&ans.pick===Q[qi].c){const b=Math.max(0,Math.round(MAXP*(1-ans.timeMs/mx)));p[id].delta=b;p[id].score=(p[id].score||0)+b}
      else if(p[id])p[id].delta=0;
    });
    Object.keys(p).forEach(id=>{if(!a[id]&&p[id])p[id].delta=0});
    await fbSet(`quiz/${code}/players`,p);
    await fbSet(`quiz/${code}/state`,{phase:"reveal",currentQ:qi,startTime:qStart.current});
    setPlayers(p);setPhase("reveal");
  };
  const hostLB=async()=>{await fbSet(`quiz/${code}/state`,{phase:"leaderboard",currentQ:qi});setPhase("leaderboard")};
  const hostNext=async()=>{
    if(qi+1>=Q.length){await fbSet(`quiz/${code}/state`,{phase:"final",currentQ:qi});setPhase("final")}
    else hostStartQ(qi+1);
  };

  // Player
  const playerJoin=async()=>{
    if(!joinCode||joinCode.length!==4){setErr("Enter a 4-digit code");return}
    if(!name.trim()){setErr("Enter your name");return}
    const st=await fbGet(`quiz/${joinCode}/state`);
    if(!st){setErr("Session not found");return}
    const p=await fbGet(`quiz/${joinCode}/players`)||{};
    if(Object.values(p).some(x=>x.name?.toLowerCase()===name.trim().toLowerCase())){setErr("Name taken");return}
    p[pid]={name:name.trim(),avatar:avIdx,score:0,delta:0};
    await fbSet(`quiz/${joinCode}/players`,p);
    setCode(joinCode);setRole("player");setPlayers(p);setPhase("lobby");
    unsubs.current.push(fbOn(`quiz/${joinCode}/state`,s=>{if(s)setGState(s)}));
    unsubs.current.push(fbOn(`quiz/${joinCode}/players`,pl=>{if(pl)setPlayers(pl)}));
  };
  const playerPick=async(pick)=>{
    if(sent)return;setMyPick(pick);setSent(true);
    const elapsed=Date.now()-(gState?.startTime||0);
    await fbSet(`quiz/${code}/ans_${gState?.currentQ}/${pid}`,{pick,timeMs:elapsed});
  };

  // Player state sync
  useEffect(()=>{
    if(role!=="player"||!gState)return;
    const gp=gState.phase;
    if(gp!==prevP.current){
      prevP.current=gp;
      if(gp==="question"){
        setQi(gState.currentQ);setMyPick(null);setSent(false);setPhase("question");
        qStart.current=gState.startTime;setTl(tFor(gState.currentQ));
        stopT();tRef.current=setInterval(()=>setTl(t=>{if(t<=1){clearInterval(tRef.current);return 0}return t-1}),1000);
      }
      if(gp==="reveal"){stopT();setQi(gState.currentQ);setPhase("reveal")}
      if(gp==="leaderboard")setPhase("leaderboard");
      if(gp==="final")setPhase("final");
    }
  },[gState,role]);

  const L=["A","B","C","D"],colors=[TK.bad,"#3B82F6",TK.orange,TK.ok];

  // ═══ SCREENS ═══
  // HOST LANDING
  if(phase==="choose"&&urlMode==="host")return(
    <BrandBg><div style={{maxWidth:560,margin:"0 auto",textAlign:"center"}}>
      <TKOLogo/>
      <div style={{marginTop:64}}>
        <h1 style={{fontSize:52,fontWeight:800,lineHeight:1.1,fontFamily:"Georgia,serif",color:TK.orange,textTransform:"uppercase",letterSpacing:".02em"}}>AI Quiz</h1>
        <p style={{fontSize:14,fontWeight:600,color:"rgba(27,20,100,.35)",marginTop:12,letterSpacing:".1em",textTransform:"uppercase"}}>Host Dashboard</p>
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:20,marginTop:40}}>
        {[{n:"8",l:"Geopolitics",c:"#E21B3C"},{n:"10",l:"Market",c:"#26890C"},{n:"6",l:"Internal",c:TK.orange}].map((s,i)=>
          <div key={i} style={{padding:"16px 20px",borderRadius:12,background:"rgba(27,20,100,.04)",border:"1px solid rgba(27,20,100,.08)",minWidth:100}}>
            <div style={{fontSize:28,fontWeight:800,color:s.c}}>{s.n}</div>
            <div style={{fontSize:12,color:"rgba(27,20,100,.4)",marginTop:3}}>{s.l}</div>
          </div>
        )}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginTop:48,maxWidth:340,margin:"48px auto 0"}}>
        <Btn onClick={hostCreate}>Start a Session</Btn>
        <Btn outline onClick={()=>window.location.search="?review"}>Review Questions</Btn>
      </div>
    </div></BrandBg>
  );

  // PLAYER LANDING — straight to join form
  if(phase==="choose"&&urlMode==="player")return(
    <BrandBg><div style={{maxWidth:420,margin:"0 auto",textAlign:"center"}}>
      <TKOLogo/>
      <div style={{marginTop:48}}>
        <h1 style={{fontSize:42,fontWeight:800,lineHeight:1.1,fontFamily:"Georgia,serif",color:TK.orange,textTransform:"uppercase"}}>AI Quiz</h1>
        <p style={{fontSize:15,color:"rgba(27,20,100,.4)",marginTop:10}}>Enter the session code to join</p>
      </div>
      <div style={{marginTop:32,textAlign:"left"}}>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".08em"}}>Session Code</label>
          <input value={joinCode} onChange={e=>{setJoinCode(e.target.value.replace(/\D/g,"").slice(0,4));setErr("")}} placeholder="4-digit code" maxLength={4} style={{width:"100%",marginTop:6,padding:"14px 16px",borderRadius:10,fontSize:28,fontWeight:700,textAlign:"center",letterSpacing:".3em",background:"rgba(27,20,100,.04)",border:"1.5px solid rgba(27,20,100,.12)",color:TK.navy,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".08em"}}>Your Name</label>
          <input value={name} onChange={e=>{setName(e.target.value.slice(0,20));setErr("")}} placeholder="Enter your name" maxLength={20} style={{width:"100%",marginTop:6,padding:"12px 16px",borderRadius:10,fontSize:16,background:"rgba(27,20,100,.04)",border:"1.5px solid rgba(27,20,100,.12)",color:TK.navy,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div>
          <label style={{fontSize:12,fontWeight:600,color:"rgba(27,20,100,.5)",textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:10}}>Pick Your Avatar</label>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:8}}>
            {AVATARS.map((a,i)=><button key={i} onClick={()=>setAvIdx(i)} style={{width:48,height:48,borderRadius:12,border:i===avIdx?`2px solid ${TK.orange}`:"2px solid transparent",background:a.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,boxShadow:i===avIdx?`0 0 16px ${TK.orange}44`:"none"}}>{a.emoji}</button>)}
          </div>
        </div>
      </div>
      {err&&<p style={{color:TK.bad,fontSize:13,marginTop:12,textAlign:"center"}}>{err}</p>}
      <div style={{marginTop:28,textAlign:"center"}}><Btn onClick={()=>{setRole("player");playerJoin()}} disabled={!joinCode||joinCode.length<4||!name.trim()}>Join Quiz</Btn></div>
    </div></BrandBg>
  );

  if(phase==="join")return(<Wrap w={440}><div style={{textAlign:"center"}}><Logo size={28}/><h2 style={{fontSize:24,fontWeight:300,fontFamily:"Georgia,serif",marginTop:36}}>Join the Quiz</h2><div style={{marginTop:28,display:"flex",flexDirection:"column",gap:16}}><div><label style={{fontSize:12,fontWeight:600,color:TK.grey,textTransform:"uppercase",letterSpacing:".08em"}}>Session Code</label><input value={joinCode} onChange={e=>{setJoinCode(e.target.value.replace(/\D/g,"").slice(0,4));setErr("")}} placeholder="4-digit code" maxLength={4} style={{width:"100%",marginTop:6,padding:"14px 16px",borderRadius:10,fontSize:24,fontWeight:700,textAlign:"center",letterSpacing:".3em",background:"rgba(27,20,100,.04)",border:"1.5px solid rgba(27,20,100,.12)",color:TK.navy,outline:"none",boxSizing:"border-box"}}/></div><div><label style={{fontSize:12,fontWeight:600,color:TK.grey,textTransform:"uppercase",letterSpacing:".08em"}}>Your Name</label><input value={name} onChange={e=>{setName(e.target.value.slice(0,20));setErr("")}} placeholder="Enter your name" maxLength={20} style={{width:"100%",marginTop:6,padding:"12px 16px",borderRadius:10,fontSize:16,background:"rgba(27,20,100,.04)",border:"1.5px solid rgba(27,20,100,.12)",color:TK.navy,outline:"none",boxSizing:"border-box"}}/></div><div><label style={{fontSize:12,fontWeight:600,color:TK.grey,textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:10}}>Pick Your Avatar</label><div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:8}}>{AVATARS.map((a,i)=><button key={i} onClick={()=>setAvIdx(i)} style={{width:48,height:48,borderRadius:12,border:i===avIdx?`2px solid ${TK.orange}`:"2px solid transparent",background:a.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,boxShadow:i===avIdx?`0 0 16px ${TK.orange}44`:"none"}}>{a.emoji}</button>)}</div></div></div>{err&&<p style={{color:TK.bad,fontSize:13,marginTop:12}}>{err}</p>}<div style={{marginTop:28}}><Btn onClick={playerJoin} disabled={!joinCode||joinCode.length<4||!name.trim()}>Join</Btn></div><button onClick={()=>{setPhase("choose");setRole(null);setErr("")}} style={{marginTop:16,background:"none",border:"none",color:TK.grey,fontSize:13}}>← Back</button></div></Wrap>);

  if(phase==="lobby"&&role==="host")return(<Wrap w={600}><div style={{textAlign:"center"}}><Logo size={28}/><div style={{marginTop:36,padding:"32px 24px",borderRadius:20,background:"rgba(255,102,51,.08)",border:"1px solid rgba(255,102,51,.15)"}}><div style={{fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:".1em",color:TK.grey}}>Session Code</div><div style={{fontSize:64,fontWeight:800,letterSpacing:".25em",color:TK.orange,fontVariantNumeric:"tabular-nums",marginTop:8}}>{code}</div><p style={{fontSize:14,color:TK.grey,marginTop:8}}>Open this page and enter the code to join</p></div><div style={{marginTop:28}}><div style={{fontSize:13,fontWeight:600,color:TK.grey,textTransform:"uppercase",letterSpacing:".08em",marginBottom:14}}>{nPlayers} player{nPlayers!==1?"s":""}</div>{nPlayers===0?<p style={{color:TK.grey,fontSize:14,fontStyle:"italic"}}>Waiting for players…</p>:<div style={{display:"flex",flexWrap:"wrap",gap:12,justifyContent:"center"}}>{Object.values(players).map((p,i)=><div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"12px 16px",borderRadius:12,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)",minWidth:80}}><Av i={p.avatar} size={40}/><span style={{fontSize:13,fontWeight:500,color:TK.navy}}>{p.name}</span></div>)}</div>}</div><div style={{marginTop:36}}><Btn onClick={()=>hostStartQ(0)} disabled={nPlayers===0}>Start Quiz →</Btn></div></div></Wrap>);

  if(phase==="lobby"&&role==="player")return(<Wrap w={440}><div style={{textAlign:"center"}}><Logo size={28}/><div style={{marginTop:40}}><Av i={avIdx} size={64}/></div><h2 style={{fontSize:22,fontWeight:400,fontFamily:"Georgia,serif",marginTop:16}}>{name}</h2><p style={{color:TK.grey,fontSize:14,marginTop:4}}>Session <span style={{color:TK.orange,fontWeight:700}}>{code}</span></p><div style={{marginTop:32,padding:"20px",borderRadius:14,background:"rgba(27,20,100,.02)",border:"1px solid rgba(27,20,100,.08)"}}><div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>{Object.values(players).map((p,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,background:"rgba(27,20,100,.04)"}}><span style={{fontSize:18}}>{AVATARS[p.avatar]?.emoji}</span><span style={{fontSize:13,color:"#6B6A80"}}>{p.name}</span></div>)}</div></div><div style={{marginTop:36}}><div className="spinner"/></div><p style={{color:TK.grey,fontSize:14,marginTop:12}}>Waiting for the host…</p></div></Wrap>);

  if(phase==="question"&&role==="host")return(<Wrap w={800}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><Logo size={24}/><div style={{display:"flex",alignItems:"center",gap:14}}><span style={{fontSize:12,fontWeight:600,color:TK.navy,padding:"3px 10px",borderRadius:6,background:TK.orange}}>{question.cat}</span><span style={{fontSize:14,color:TK.grey}}>Q{qi+1}/{Q.length}</span></div></div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:12,color:TK.grey}}>Question {qi+1}</span><span style={{fontSize:28,fontWeight:800,color:tl<=5?TK.bad:TK.white,fontVariantNumeric:"tabular-nums"}}>{tl}</span></div><TBar tl={tl} mx={tFor(qi)}/><div style={{display:"flex",gap:20,marginTop:20,alignItems:"stretch"}}><div style={{flex:1,padding:"28px",borderRadius:16,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)",display:"flex",alignItems:"center"}}><h2 style={{fontSize:26,fontWeight:400,lineHeight:1.45,margin:0,fontFamily:"Georgia,serif"}}>{question.q}</h2></div><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,justifyContent:"center"}}><QImg qi={qi} size={130}/><LiveCounter answered={nAnswers} total={nPlayers}/></div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}}>{question.o.map((o,i)=><div key={i} style={{padding:"20px 18px",borderRadius:14,background:`${colors[i]}12`,border:`1.5px solid ${colors[i]}33`,display:"flex",alignItems:"center",gap:12}}><span style={{width:36,height:36,borderRadius:10,background:colors[i],color:TK.navy,fontWeight:800,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>{L[i]}</span><span style={{fontSize:16,color:TK.navy,lineHeight:1.4}}>{o}</span></div>)}</div><div style={{textAlign:"center",marginTop:24}}><Btn onClick={hostReveal}>Reveal Answer</Btn></div></Wrap>);

  if(phase==="question"&&role==="player"){const gqi=gState?.currentQ??0,pq=Q[gqi];return(<Wrap w={420}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontSize:13,fontWeight:600,color:TK.navy}}>Q{gqi+1}/{Q.length}</span><span style={{fontSize:24,fontWeight:800,color:tl<=5?TK.bad:TK.navy,fontVariantNumeric:"tabular-nums"}}>{tl}</span></div><TBar tl={tl} mx={tFor(gqi)}/><div style={{padding:"16px",borderRadius:12,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)",marginTop:14,marginBottom:16}}><h2 style={{fontSize:17,fontWeight:400,lineHeight:1.45,margin:0,fontFamily:"Georgia,serif",color:TK.navy}}>{pq.q}</h2></div><PlayerOptions options={pq.o} colors={colors} L={L} onPick={(i)=>playerPick(i)} picked={myPick} disabled={sent}/>{sent&&<div style={{textAlign:"center",marginTop:20,padding:"14px",borderRadius:12,background:"rgba(27,20,100,.04)",border:"1px solid rgba(27,20,100,.08)"}}><span style={{fontSize:24}}>✓</span><p style={{fontSize:14,color:TK.grey,margin:"6px 0 0"}}>Locked in — waiting for reveal</p></div>}</Wrap>)}

  if(phase==="reveal"&&role==="host")return(<Wrap w={1000}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><Logo size={24}/><div style={{display:"flex",alignItems:"center",gap:12}}><div style={{padding:"8px 14px",borderRadius:8,background:"rgba(27,20,100,.04)",border:"1px solid rgba(27,20,100,.08)",fontSize:13,color:TK.grey}}>👥 {nAnswers}/{nPlayers} answered</div><span style={{fontSize:12,fontWeight:600,color:"#fff",padding:"3px 10px",borderRadius:6,background:TK.orange}}>Reveal</span></div></div>
    <div style={{display:"flex",gap:24,alignItems:"flex-start"}}>
      {/* LEFT: question + options */}
      <div style={{flex:"1 1 55%",minWidth:0}}>
        <div style={{padding:"20px 24px",borderRadius:16,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)"}}><h2 style={{fontSize:22,fontWeight:400,lineHeight:1.45,margin:0,fontFamily:"Georgia,serif"}}>{question.q}</h2></div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:14}}>
          {question.o.map((o,i)=>{const isC=i===question.c;const barW=nAnswers>0?Math.max(4,(dist[i]/nAnswers)*100):0;return <div key={i} className={isC?"reveal-glow":""} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",borderRadius:12,background:isC?TK.okBg:"rgba(27,20,100,.03)",border:`1.5px solid ${isC?TK.ok:"rgba(27,20,100,.1)"}`,color:isC?TK.ok:TK.navy,position:"relative",overflow:"hidden",transition:"all .4s ease"}}><div style={{position:"absolute",left:0,top:0,bottom:0,width:`${barW}%`,background:isC?"rgba(52,211,153,.1)":"rgba(27,20,100,.03)",transition:"width .8s ease"}} /><span style={{width:32,height:32,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:isC?TK.ok:"rgba(27,20,100,.06)",color:isC?"#fff":"#6B6A80",fontWeight:700,fontSize:13,position:"relative",transition:"all .3s"}}>{L[i]}</span><span style={{flex:1,lineHeight:1.4,position:"relative",fontWeight:isC?600:400}}>{o}</span>{dist[i]>0&&<span style={{fontSize:14,fontWeight:700,color:isC?TK.ok:TK.grey,position:"relative",background:isC?"rgba(52,211,153,.1)":"rgba(27,20,100,.04)",padding:"2px 10px",borderRadius:6}}>{dist[i]}</span>}</div>})}
        </div>
      </div>
      {/* RIGHT: image + explanation + source — slides in */}
      <div style={{flex:"1 1 42%",minWidth:0}}>
        <div className="slide-r sr1" style={{display:"flex",alignItems:"center",gap:16,marginBottom:16}}>
          <QImg qi={qi} size={80}/>
          <div>
            <div style={{fontSize:12,fontWeight:600,color:TK.orange,textTransform:"uppercase",letterSpacing:".1em"}}>{question.cat}</div>
            <div style={{fontSize:13,color:TK.grey,marginTop:2}}>Question {qi+1} of {Q.length}</div>
          </div>
        </div>
        <div className="slide-r sr2" style={{padding:"18px 20px",borderRadius:14,background:"rgba(255,102,51,.06)",border:"1px solid rgba(255,102,51,.12)"}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:TK.orange,marginBottom:8}}>✓ Answer</div>
          <div style={{fontSize:16,fontWeight:600,lineHeight:1.5,color:TK.navy}}>{question.o[question.c]}</div>
          <div style={{marginTop:10,fontSize:14,lineHeight:1.6,color:"#5A596E"}}>{question.ex}</div>
        </div>
        <div className="slide-r sr3"><SCard q={question}/></div>
        <div className="slide-r sr4" style={{textAlign:"center",marginTop:20}}><Btn onClick={hostLB}>Show Leaderboard →</Btn></div>
      </div>
    </div>
  </Wrap>);

  if(phase==="reveal"&&role==="player"){const gqi=gState?.currentQ??0,pq=Q[gqi],ok=myPick===pq.c,me=players[pid];return(<Wrap w={440}><div style={{textAlign:"center",marginTop:20}}><div style={{fontSize:64,marginBottom:12}}>{ok?"🎉":myPick===null?"⏱":"😬"}</div><h2 style={{fontSize:26,fontWeight:400,fontFamily:"Georgia,serif",color:ok?TK.ok:(myPick===null?TK.grey:TK.bad)}}>{ok?"Correct!":myPick===null?"Time's up":"Not quite"}</h2>{ok&&me&&<p style={{fontSize:18,fontWeight:700,color:TK.orange,marginTop:8}}>+{me.delta} pts</p>}<div style={{textAlign:"left",marginTop:16}}><div style={{padding:"14px 18px",borderRadius:12,background:"rgba(27,20,100,.03)",border:"1px solid rgba(27,20,100,.08)"}}><div style={{fontSize:14,color:TK.ok,fontWeight:600}}>Answer: {pq.o[pq.c]}</div><p style={{fontSize:13,color:TK.grey,marginTop:8,lineHeight:1.5}}>{pq.ex}</p></div><SCard q={pq}/></div><div style={{marginTop:24}}><div className="spinner"/><p style={{color:TK.grey,fontSize:13,marginTop:8}}>Waiting for leaderboard…</p></div></div></Wrap>)}

  if(phase==="leaderboard")return(<Wrap w={700}><div style={{textAlign:"center"}}><Logo size={24}/><h2 className="fi" style={{fontSize:28,fontWeight:300,fontFamily:"Georgia,serif",marginTop:24,color:TK.navy}}>Leaderboard</h2><p className="fi d1" style={{fontSize:13,color:TK.grey}}>After question {qi+1} of {Q.length} · {Object.keys(players).length} players</p></div><div style={{marginTop:24}}><LBoard players={players}/></div>{role==="host"&&<div className="fi d5" style={{textAlign:"center",marginTop:28}}><Btn onClick={hostNext}>{qi+1>=Q.length?"Final Results →":"Next Question →"}</Btn></div>}{role==="player"&&qi+1<Q.length&&<div style={{textAlign:"center",marginTop:24}}><div className="spinner"/><p style={{color:TK.grey,fontSize:13,marginTop:8}}>Next question…</p></div>}</Wrap>);

  if(phase==="final"){const sorted=Object.entries(players).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0));const w=sorted[0];const me=role==="player"?sorted.find(p=>p.id===pid):null;const mr=me?sorted.indexOf(me)+1:0;return(<Wrap w={560}><div style={{textAlign:"center"}}><Logo size={28}/><div style={{fontSize:48,marginTop:32}}>🏆</div><h2 style={{fontSize:32,fontWeight:300,fontFamily:"Georgia,serif",marginTop:12}}>{role==="player"&&mr===1?"You won!":role==="player"?`#${mr}`:"Final Results"}</h2>{w&&<div style={{marginTop:16,display:"inline-flex",alignItems:"center",gap:10,padding:"12px 24px",borderRadius:14,background:"rgba(255,102,51,.1)",border:"1px solid rgba(255,102,51,.2)"}}><Av i={w.avatar} size={44}/><div style={{textAlign:"left"}}><div style={{fontSize:18,fontWeight:600,color:TK.orange}}>{w.name}</div><div style={{fontSize:14,color:TK.grey}}>{w.score} pts</div></div></div>}</div><div style={{marginTop:28}}><LBoard players={players} showD={false}/></div>{role==="host"&&<div style={{textAlign:"center",marginTop:28}}><Btn outline onClick={()=>{fbDel(`quiz/${code}`);cleanup();setPhase("choose");setRole(null);setPlayers({});setAnswers({})}}>End Session</Btn></div>}</Wrap>)}

  return <Wrap><p style={{color:TK.grey,textAlign:"center"}}>Loading…</p></Wrap>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
